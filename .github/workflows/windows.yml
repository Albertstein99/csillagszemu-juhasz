name: Windows build and vision tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python setup/build.py
      - name: Install and verify the distributed Windows package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'csillagszem-install'
          $proc = Start-Process -FilePath (Resolve-Path 'dist/Csillagszemu-Juhasz-Setup.exe') -ArgumentList @('--test-install', $stage) -Wait -PassThru -WindowStyle Hidden
          Get-Content (Join-Path $stage 'installer.log')
          if ($proc.ExitCode -ne 0) { throw "Installer exited with $($proc.ExitCode)" }
          $installed = Get-Content (Join-Path $stage 'installed.txt') -Raw
          "APP_PYTHON=$installed\python\python.exe" >> $env:GITHUB_ENV
      - name: Run desktop and calibration checks
        shell: pwsh
        run: '& $env:APP_PYTHON -m unittest discover -s tests -v'
      - name: Exercise the installed vision models with a real image
        shell: pwsh
        run: |
          $portrait = Join-Path $env:RUNNER_TEMP 'csillagszem-test-portrait.jpg'
          Invoke-WebRequest 'https://storage.googleapis.com/mediapipe-assets/portrait.jpg' -OutFile $portrait
          $installed = Split-Path (Split-Path $env:APP_PYTHON)
          & $env:APP_PYTHON tests/real_image.py $portrait $installed
      - uses: actions/upload-artifact@v4
        with:
          name: Csillagszemu-Juhasz-Windows
          path: dist/Csillagszemu-Juhasz-Windows.zip
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Csillagszemu-Juhasz-Windows
      - name: Publish the versioned Windows preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'from csillagszem import __version__; print(__version__)')
          if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$version" Csillagszemu-Juhasz-Windows.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Csillagszemű Juhász $version" --notes "Windows x64 preview. Extract the ZIP and open the setup program. Internet is required for installation. Measure your own setup with Check accuracy."
          fi
